<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-hero">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="mb-1">Find your next game</h2>
                    <p class="mb-0">Browse open games nearby and book a spot in seconds.</p>
                </div>
                <a th:href="@{/games/new}" class="btn btn-light"><i class="bi bi-plus-lg me-1"></i>Create Game</a>
            </div>
        </div>
    </div>

    <div class="container">

        <div th:if="${successMessage}" class="alert alert-success mt-4" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger mt-4" th:text="${errorMessage}"></div>

        <form method="get" th:action="@{/games}" th:object="${gameFilterDto}" class="filter-bar">
            <div class="row g-2">
                <div class="col">
                    <select th:field="*{city}" class="form-select">
                        <option value="">-- Any City --</option>
                        <option th:each="c : ${cities}" th:value="${c}" th:text="${c}"></option>
                    </select>
                </div>
                <div class="col">
                    <select th:field="*{area}" class="form-select">
                        <option value="">-- Any Area --</option>
                        <option th:each="a : ${areas}" th:value="${a}" th:text="${a}"></option>
                    </select>
                </div>
                <div class="col">
                    <select th:field="*{gameType}" class="form-select">
                        <option value="">-- Any Game Type --</option>
                        <option th:each="type : ${gameTypes}" th:value="${type}" th:text="${type.label}"></option>
                    </select>
                </div>
                <div class="col">
                    <select th:field="*{genderOption}" class="form-select">
                        <option value="">-- Any Gender --</option>
                        <option th:each="option : ${genderOptions}" th:value="${option}" th:text="${option}"></option>
                    </select>
                </div>
                <div class="col">
                    <input type="date" th:field="*{gameDate}" class="form-control" placeholder="Date" />
                </div>
                <div class="col">
                    <input type="number" step="0.01" min="0" th:field="*{maxPrice}" class="form-control" placeholder="Max Price" />
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <div class="form-check d-flex align-items-center">
                    <input type="checkbox" th:field="*{openSlotsOnly}" class="form-check-input" id="openSlotsOnly" />
                    <label for="openSlotsOnly" class="form-check-label ms-2">Open slots only</label>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/games}" class="btn btn-outline-secondary">Reset</a>
                    <button type="submit" class="btn btn-primary">Filter</button>
                </div>
            </div>
        </form>

        <div class="d-flex flex-column gap-3 mt-4">
            <div th:each="game : ${games}" th:id="'game-' + ${game.id}"
                 class="game-row"
                 th:classappend="${game.status.name() == 'CANCELLED'} ? 'accent-cancelled' : (${game.remainingSlots == 0} ? 'accent-full' : '')">

                <div class="flex-grow-1 min-width-0">
                    <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                        <span class="game-title" th:text="${game.title}"></span>
                        <span class="badge"
                              th:classappend="${game.status.name() == 'CANCELLED'} ? 'status-cancelled' : (${game.remainingSlots == 0} ? 'status-full' : 'status-open')"
                              th:text="${game.status}"></span>
                        <span th:if="${game.locationCity == preferredLocationCity and game.locationArea == preferredLocationArea}"
                              class="badge match-preferred">Preferred area</span>
                    </div>
                    <div class="game-meta">
                        <span class="icon-chip"><i class="bi bi-geo-alt-fill"></i></span><span th:text="${game.pitchName + ' - ' + game.locationCity + ' - ' + game.locationArea}"></span>
                        <span class="mx-2">&middot;</span>
                        <span class="icon-chip"><i class="bi bi-calendar-event"></i></span><span th:text="${#temporals.format(game.gameDate, 'EEE, d MMM yyyy')}"></span>
                        <span th:text="${' - ' + game.gameTime}"></span>
                        <span class="mx-2">&middot;</span>
                        <span class="icon-chip"><i class="bi bi-people-fill"></i></span><span th:text="${game.gameType.label + ' - ' + game.genderOption}"></span>
                        <span class="mx-2">&middot;</span>
                        <span class="icon-chip"><i class="bi bi-person-check-fill"></i></span><span th:text="${game.attendingCount + ' / ' + game.maxPlayers + ' attending'}"></span>
                    </div>
                </div>

                <div class="game-price" th:text="${game.price}"></div>

                <div class="d-flex gap-2 flex-shrink-0">
                    <a th:href="@{/games/{id}(id=${game.id})}" class="btn btn-outline-primary btn-sm">View</a>
                    <a th:if="${game.organiserEmail == currentUserEmail or #authorization.expression('hasRole(''ROLE_ADMIN'')')}"
                       th:href="@{/games/{id}/edit(id=${game.id})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                    <form th:if="${(game.organiserEmail == currentUserEmail or #authorization.expression('hasRole(''ROLE_ADMIN'')')) and game.status.name() != 'CANCELLED' and !game.pastGame}"
                          method="post" th:action="@{/games/{id}/cancel(id=${game.id})}" class="cancel-form"
                          data-confirm-message="Are you sure you want to cancel this game? All confirmed players will be refunded.">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Cancel</button>
                    </form>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(games)}" class="empty-state">
            <div class="empty-icon"><i class="bi bi-search"></i></div>
            <p class="mb-0">No games match your filters right now.</p>
        </div>

    </div>
    <div class="mb-5"></div>

    <script>
        document.querySelectorAll('.cancel-form').forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!confirm(form.getAttribute('data-confirm-message'))) {
                    event.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
