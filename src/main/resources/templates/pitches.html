<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pitches</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-hero">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="mb-1"><i class="bi bi-geo-alt-fill me-2"></i>Pitches</h2>
                    <p class="mb-0">Manage the pitches available for booking.</p>
                </div>
                <a th:href="@{/admin/pitches/new}" class="btn btn-light"><i class="bi bi-plus-lg me-1"></i>Add Pitch</a>
            </div>
        </div>
    </div>

    <div class="container">

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <div class="surface">
        <table class="table table-borderless align-middle mb-0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Location</th>
                    <th>Capacity</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="pitch : ${pitches}" th:id="'pitch-' + ${pitch.id}">
                    <td th:text="${pitch.name}"></td>
                    <td th:text="${pitch.locationCity + ' - ' + pitch.locationArea}"></td>
                    <td th:text="${pitch.capacity}"></td>
                    <td>
                        <span th:if="${pitch.active}" class="badge status-open">Active</span>
                        <span th:unless="${pitch.active}" class="badge status-cancelled">Inactive</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/pitches/{id}/edit(id=${pitch.id})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                        <form method="post" th:action="@{/admin/pitches/{id}/status(id=${pitch.id})}" class="d-inline">
                            <input type="hidden" name="activeStatus" th:value="${!pitch.active}" />
                            <button type="submit"
                                    th:class="${pitch.active} ? 'btn btn-outline-danger btn-sm' : 'btn btn-outline-success btn-sm'"
                                    th:text="${pitch.active} ? 'Deactivate' : 'Activate'"></button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

    </div>
</body>
</html>
