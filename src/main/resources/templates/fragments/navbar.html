<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-success mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" style="letter-spacing: 0.5px;" th:href="@{/games}">&#9917; KickAbout</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" th:href="@{/games}"><i class="bi bi-grid-fill me-1"></i>Games</a>
                <a class="nav-link" th:href="@{/my-bookings}"><i class="bi bi-calendar-check-fill me-1"></i>My Bookings</a>
                <a class="nav-link" th:href="@{/profile}"><i class="bi bi-person-fill me-1"></i>Profile</a>
                <a class="nav-link" sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/pitches}"><i class="bi bi-geo-alt-fill me-1"></i>Admin: Pitches</a>
                <a class="nav-link" sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin/users}"><i class="bi bi-people-fill me-1"></i>Admin: Users</a>
            </div>
            <span class="navbar-text fw-bold text-white me-3 px-2 py-1 rounded bg-dark bg-opacity-25"
                  th:if="${loggedInUsername != null}" th:text="${loggedInUsername}"></span>
            <span class="navbar-text text-white me-3" th:if="${creditBalance != null}">
                <i class="bi bi-coin me-1"></i><span th:text="${creditBalance + ' credits'}"></span>
            </span>
            <form method="post" th:action="@{/logout}" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i>Log Out</button>
            </form>
        </div>

        <script>
            document.querySelectorAll('.nav-link').forEach(function (link) {
                if (window.location.pathname.startsWith(link.getAttribute('href'))) {
                    link.classList.add('active');
                }
            });
        </script>
    </nav>
</body>
</html>
