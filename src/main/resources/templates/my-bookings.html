<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-hero">
        <div class="container">
            <h2 class="mb-1"><i class="bi bi-calendar-check-fill me-2"></i>My Bookings</h2>
            <p class="mb-0">Everything you've joined, past and upcoming.</p>
        </div>
    </div>

    <div class="container">

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <h4 class="mb-3">Upcoming</h4>
        <div class="surface mb-4">
        <table class="table table-borderless align-middle mb-0">
            <thead>
                <tr>
                    <th>Game</th>
                    <th>Pitch</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}" th:if="${!booking.pastGame}" th:id="'booking-' + ${booking.id}">
                    <td th:text="${booking.gameTitle}"></td>
                    <td th:text="${booking.pitchName + ' - ' + booking.locationCity + ' - ' + booking.locationArea}"></td>
                    <td th:text="${#temporals.format(booking.gameDate, 'EEEE, d MMM yyyy')}"></td>
                    <td th:text="${booking.gameTime}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'status-open' : (${booking.status.name() == 'HELD'} ? 'status-pending' : (${booking.status.name() == 'CANCELLED'} ? 'status-cancelled' : 'status-muted'))"
                              th:text="${booking.status}"></span>
                    </td>
                    <td>
                        <a th:if="${booking.status.name() != 'ABANDONED' and booking.status.name() != 'EXPIRED' and booking.status.name() != 'WITHDRAWN'}"
                           th:href="@{/games/{id}(id=${booking.gameId})}" class="btn btn-outline-primary btn-sm">View</a>
                        <form th:if="${booking.status.name() == 'CONFIRMED'}" method="post"
                              th:action="@{/my-bookings/{id}/withdraw(id=${booking.gameId})}"
                              class="d-inline withdraw-form" th:attr="data-confirm-message=${booking.withdrawConfirmMessage}">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Withdraw</button>
                        </form>
                        <span th:if="${booking.status.name() == 'ABANDONED' or booking.status.name() == 'EXPIRED' or booking.status.name() == 'WITHDRAWN'}"
                              class="text-muted small">&mdash;</span>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

        <h4 class="mb-3">Past</h4>
        <div class="surface">
        <table class="table table-borderless align-middle mb-0">
            <thead>
                <tr>
                    <th>Game</th>
                    <th>Pitch</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}" th:if="${booking.pastGame}" th:id="'booking-' + ${booking.id}">
                    <td th:text="${booking.gameTitle}"></td>
                    <td th:text="${booking.pitchName + ' - ' + booking.locationCity + ' - ' + booking.locationArea}"></td>
                    <td th:text="${#temporals.format(booking.gameDate, 'EEEE, d MMM yyyy')}"></td>
                    <td th:text="${booking.gameTime}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'status-open' : (${booking.status.name() == 'HELD'} ? 'status-pending' : (${booking.status.name() == 'CANCELLED'} ? 'status-cancelled' : 'status-muted'))"
                              th:text="${booking.status}"></span>
                    </td>
                    <td>
                        <a th:if="${booking.status.name() != 'ABANDONED' and booking.status.name() != 'EXPIRED' and booking.status.name() != 'WITHDRAWN'}"
                           th:href="@{/games/{id}(id=${booking.gameId})}" class="btn btn-outline-primary btn-sm">View</a>
                        <span th:if="${booking.status.name() == 'ABANDONED' or booking.status.name() == 'EXPIRED' or booking.status.name() == 'WITHDRAWN'}"
                              class="text-muted small">&mdash;</span>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>

    </div>

    <script>
        document.querySelectorAll('.withdraw-form').forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!confirm(form.getAttribute('data-confirm-message'))) {
                    event.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
